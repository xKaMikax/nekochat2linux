name: NekoChatReloaded
options:
  bundleIdPrefix: dev.kamika
  deploymentTarget:
    iOS: "16.4"
targets:
  NekoChatReloaded:
    type: application
    platform: iOS
    sources:
      - path: NekoChat/Sources
      - path: NekoChat/Assets.xcassets
      # The desktop web UI, served by WebContent.swift from the bundle's web/ folder.
      - path: NekoChat/web
        type: folder
        buildPhase: resources
    info:
      path: NekoChat/Info.plist
      properties:
        CFBundleDisplayName: NekoChat Reloaded
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: NekoChat Reloaded uses the microphone for voice calls.
        # Keeps a running voice call alive when the app goes to the background.
        UIBackgroundModes:
          - audio
        # Users may point the client at their own http:// NekoChat server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kamika.nekochat-reloaded
        PRODUCT_NAME: NekoChatReloaded
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
