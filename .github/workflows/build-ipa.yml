name: Build IPA

on:
  push:
    branches: [iphone]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project NekoChatReloaded.xcodeproj -target NekoChatReloaded \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|error [A-Z]" build.log | sort -u | head -60 | sed 's/^/::error::/' || true

      - name: Package the IPA
        run: |
          app=build/Release-iphoneos/NekoChatReloaded.app
          echo "::notice::App $(du -sh "$app" | cut -f1), web files: $(find "$app/web" -type f | wc -l | tr -d ' '), host: $(ls "$app/web/ios" | tr '\n' ' ')" 
          mkdir -p Payload
          cp -R build/Release-iphoneos/NekoChatReloaded.app Payload/
          zip -qry "NekoChat-Reloaded-1.0.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NekoChat-Reloaded-1.0-ipa
          path: NekoChat-Reloaded-1.0.ipa
