<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display Properties</title><link id="frame-style" rel="stylesheet" href="assets/css/style.css"><link id="frame-theme" rel="stylesheet" href="data:text/css,"><link rel="stylesheet" href="assets/css/theme-settings.css"><link rel="stylesheet" href="assets/css/theme-controls.css">
</head>
<body>
  <div class="xp-window settings-window">
    <header class="xp-titlebar"><span class="xp-title">Display Properties</span><div class="xp-window-controls"><button id="close" aria-label="Close"></button></div></header>
    <main class="properties">
      <nav class="property-tabs"><button class="property-tab active" data-page="themes">Themes</button><button class="property-tab" data-page="appearance">Appearance</button></nav>
      <section class="property-page" id="themes-page"><p>A theme is a background plus a set of window colours and controls.</p><label>Theme:<select id="theme-list"></select></label><div class="preview"><div class="preview-window"><div class="preview-title">Active Window <span class="preview-controls"><i class="preview-min"></i><i class="preview-max"></i><i class="preview-close"></i></span></div><p>Window Text</p></div></div><p class="error" id="theme-error" role="alert"></p><div class="inline-actions"><button id="theme-import">Add Theme…</button></div></section>
      <section class="property-page appearance-page" id="appearance-page" hidden><div class="preview appearance-preview"><div class="preview-window"><div class="preview-title">Active Window <span class="preview-controls"><i class="preview-min"></i><i class="preview-max"></i><i class="preview-close"></i></span></div><p>Window Text</p><button>OK</button></div></div><label>Windows and buttons:<select id="windows-style"><option>Windows XP style</option></select></label><label>Colour scheme:<select id="colour-scheme"></select></label><label>Font size:<select id="font-size"><option>Normal</option><option>Large</option><option>Extra Large</option></select></label><div class="appearance-actions"><button id="effects">Effects…</button><button id="advanced">Advanced</button></div></section>
      <footer><button id="ok">OK</button><button id="cancel">Cancel</button><button id="apply">Apply</button></footer>
    </main>
  </div>
  <script src="assets/js/theme-settings.js"></script>
</body>
</html>
