<!doctype html><html><head><meta charset="UTF-8"><base href="../../"><link id="preview-theme" rel="stylesheet" href="data:text/css,"><link rel="stylesheet" href="assets/css/theme-preview.css"><script src="assets/js/android-bridge.js"></script><link rel="stylesheet" href="assets/css/android.css"></head><body><div class="wallpaper"><section class="preview-window"><header>Active Window<span class="controls"><i class="min"></i><i class="max"></i><i class="close"></i></span></header><p>Window Text</p><button>OK</button></section></div><script>const link=document.querySelector('#preview-theme'),urlFor=name=>{const value=getComputedStyle(document.documentElement).getPropertyValue(name);const match=value.match(/url\(["']?(.*?)["']?\)/);return match&&match[1]};function renderGlyphs(){[['.min','--xp-minimize-glyph'],['.max','--xp-maximize-glyph'],['.close','--xp-close-glyph']].forEach(([selector,property])=>{const url=urlFor(property),node=document.querySelector(selector);if(url)node.innerHTML=`<img src="${url}" alt="">`})}addEventListener('message',e=>{if(e.data?.type!=='theme-preview'||!e.data.theme?.cssUrl)return;link.addEventListener('load',renderGlyphs,{once:true});link.href=e.data.theme.cssUrl;requestAnimationFrame(renderGlyphs)});</script></body></html>
