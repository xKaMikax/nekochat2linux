<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../../">
  <title>NekoChat Emoji</title><link id="frame-style" rel="stylesheet" href="assets/css/style.css"><link id="frame-theme" rel="stylesheet" href="data:text/css,"><link rel="stylesheet" href="assets/css/emoji-browser.css"><link rel="stylesheet" href="assets/css/theme-controls.css">
<script src="assets/js/ios-bridge.js"></script><link rel="stylesheet" href="assets/css/ios.css"></head>
<body>
  <div class="xp-window emoji-browser-window">
    <header class="xp-titlebar"><span class="xp-app-icon has-icon" style="background-image:url('assets/images/nekochat_icon.png')"></span><span class="xp-title">Эмодзи NekoChat</span><div class="xp-window-controls"><button id="close" aria-label="Закрыть"></button></div></header>
    <div class="xp-body-frame"><i class="xp-side xp-side-left"></i><main class="emoji-browser"><label class="emoji-search"><span>⌕</span><input id="emoji-search" type="search" autocomplete="off" placeholder="Поиск emoji…"></label><div class="skin-tone"><span id="skin-tone-label">Тон кожи:</span><button type="button" class="active" data-skin-tone="" title="Стандартный">✋</button><button type="button" data-skin-tone="🏻" title="Светлый">👋🏻</button><button type="button" data-skin-tone="🏼" title="Светло-средний">👋🏼</button><button type="button" data-skin-tone="🏽" title="Средний">👋🏽</button><button type="button" data-skin-tone="🏾" title="Тёмно-средний">👋🏾</button><button type="button" data-skin-tone="🏿" title="Тёмный">👋🏿</button></div><div class="emoji-picker-body"><nav class="emoji-groups" id="emoji-groups" aria-label="Категории emoji"></nav><section class="emoji-library"><h1 id="emoji-group-title">Все emoji</h1><p class="emoji-count" id="emoji-count"></p><div class="emoji-grid" id="emoji-grid" role="listbox"></div></section></div></main><i class="xp-side xp-side-right"></i></div>
    <i class="xp-bottom"></i>
  </div>
  <script src="assets/js/emoji-data.js"></script><script src="assets/js/emoji-browser.js"></script>

</html>
